name: test workflow
on: workflow_dispatch
env:
  API_token: ${{secrets.DEMO_TOKEN}}



jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: check API token
        run: |
          if [ -n "$API_token" ]; then
            echo "secret is configured"
          else
            echo "secret is not configured"
            exit 1
          fi
name: job output training 
on: push
jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: set version
        id: version
        run:  echo "app_version=2.0" >> $GITHUB_OUTPUT

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Show version
        run: echo "Deploying version ${{ needs.build.outputs.version }}"     
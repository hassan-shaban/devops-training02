name: test workflow
on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create report
        run: echo "Build completed successfully" >> report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: report.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: download report
        uses: actions/download-artifact@v4
        with:
          name: build-report
          path: downloaded-report

      - name: Show report
        run: cat downloaded-report/report.txt

        